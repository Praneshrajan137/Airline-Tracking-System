server:
  port: 8082

spring:
  application:
    name: llm-summary-service

  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:airlinetracker}
    username: ${POSTGRES_USER:airlinetracker}
    password: ${POSTGRES_PASSWORD:airlinetracker123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # Kafka Consumer Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: llm-summary-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "flightData:com.airlinetracker.llmsummary.dto.FlightData"

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30

# OpenAI Configuration
openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  model: ${OPENAI_MODEL:gpt-6-luna}
  max-tokens: ${OPENAI_MAX_TOKENS:150}
  temperature: ${OPENAI_TEMPERATURE:0.7}
  timeout-seconds: 10
  rate-limit:
    calls-per-minute: 3
    calls-per-hour: 10
    calls-per-day: 100
    enabled: true

# Kafka Topics
kafka:
  topics:
    flight-data-events: ${KAFKA_TOPIC:flight-data-events}
    partitions: ${KAFKA_TOPIC_PARTITIONS:1}
    replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:1}

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://zipkin:9411}/api/v2/spans

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      openAiApi:
        failureRateThreshold: 50
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true

# Logging
logging:
  level:
    root: INFO
    com.airlinetracker.llmsummary: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
    io.github.resilience4j: INFO

