server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      routes:
        - id: flight-summary-service-route
          uri: lb://LLM-SUMMARY-SERVICE
          predicates:
            - Path=/api/v1/flight/*/summary/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@addressKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
        - id: flightdata-service-route
          uri: lb://FLIGHTDATA-SERVICE
          predicates:
            - Path=/api/v1/flight/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@addressKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - http://localhost
              - http://127.0.0.1
              - http://localhost:3000
              - http://localhost:5173
            allowedMethods:
              - GET
              - POST
              - OPTIONS
            allowedHeaders:
              - Content-Type
            allowCredentials: false
            maxAge: 3600

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      show-details: never
    gateway:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://zipkin:9411}/api/v2/spans

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.netflix.discovery: INFO
