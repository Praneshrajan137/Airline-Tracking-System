name: Airline Tracker Frontier CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: '25'
  MAVEN_OPTS: -Xmx2g -XX:+TieredCompilation -XX:TieredStopAtLevel=1

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  build-and-test:
    name: Java 25 reactor and service tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build reactor and run tests
        run: sh ./mvnw -B -ntp clean verify
      - name: Upload Maven reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: |
            services/*/target/surefire-reports/
            services/*/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 30

  compose-e2e:
    name: Full-stack Compose and recovery tests
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Start isolated mock-provider stack
        run: docker compose -f integration-tests/docker-compose.e2e.yml up --build --detach --wait --wait-timeout 360
      - name: Run full-stack journey and provider recovery tests
        run: sh ./mvnw -B -ntp -pl integration-tests -am -Pcompose-e2e verify
      - name: Capture Compose diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f integration-tests/docker-compose.e2e.yml logs --no-color > artifacts/compose.log 2>&1 || true
      - name: Stop test stack
        if: always()
        run: docker compose -f integration-tests/docker-compose.e2e.yml down --remove-orphans
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-e2e-evidence
          path: |
            artifacts/compose.log
            integration-tests/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 30

  performance-gate:
    name: Gatling cache and burst gates
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Start fixture-only performance stack
        run: docker compose -f integration-tests/docker-compose.e2e.yml -f integration-tests/docker-compose.perf.yml up --build --detach --wait --wait-timeout 360
      - name: Enforce p95 and success targets
        run: sh ./mvnw -B -ntp -pl performance-tests -Pperformance-gate gatling:test -Dtarget.baseUrl=http://localhost:8080
      - name: Capture performance stack diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f integration-tests/docker-compose.e2e.yml -f integration-tests/docker-compose.perf.yml logs --no-color > artifacts/performance-compose.log 2>&1 || true
      - name: Stop performance stack
        if: always()
        run: docker compose -f integration-tests/docker-compose.e2e.yml -f integration-tests/docker-compose.perf.yml down --remove-orphans
      - name: Upload Gatling report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-performance-evidence
          path: |
            performance-tests/target/gatling/
            artifacts/performance-compose.log
          if-no-files-found: ignore
          retention-days: 30

  browser-e2e:
    name: Playwright browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser journey against deterministic fixtures
        run: npm run e2e
      - name: Upload Playwright report and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 30

  docker-build-push:
    name: Build and publish tested service images
    runs-on: ubuntu-latest
    needs: [build-and-test, compose-e2e, performance-gate, browser-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [service-registry, api-gateway, flightdata-service, llm-summary-service]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Normalize registry owner
        run: echo "REPO_OWNER_LOWERCASE=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LOWERCASE }}/${{ matrix.service }}:latest
            ghcr.io/${{ env.REPO_OWNER_LOWERCASE }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max